name: build-ps2

# Compila ELFs do PS2 na nuvem (imagem oficial ps2dev/ps2dev: ps2sdk + gsKit).
# Gera:
#   terraria-host.elf  -> dados em host:data   (ps2link / pcsx2)
#   terraria-mass.elf  -> dados em mass:data   (pendrive USB)
#   terraria-mc0.elf   -> dados em mc0:data    (memory card)
# O artefato sai na aba Actions deste repo.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (ps2dev/ps2dev)
        run: |
          docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:latest sh -c '
            set -e
            echo "PS2DEV=$PS2DEV PS2SDK=$PS2SDK GSKIT=$GSKIT"
            make clean || true
            make DATA_ROOT=host:data EE_BIN=terraria-host.elf
            make clean
            make DATA_ROOT=mass:data EE_BIN=terraria-mass.elf
            make clean
            make DATA_ROOT=mc0:data  EE_BIN=terraria-mc0.elf
            ls -l *.elf
          '

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: terraria-elf
          path: |
            terraria-host.elf
            terraria-mass.elf
            terraria-mc0.elf
